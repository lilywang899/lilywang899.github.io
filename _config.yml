# --- Edit these ---
title: Lily Wang
tagline: Notes, projects, and things I'm learning.
description: Personal site and blog.
author: Lily Wang
email: you@example.com
# For a user site (username.github.io) leave url/baseurl as-is after filling url.
url: "https://lilywang899.github.io"
baseurl: "/lilyjywang.github.io"
github_username: lilywang899
# twitter_username: yourhandle
# ------------------

permalink: /blog/:year/:month/:day/:title/
timezone: America/Los_Angeles
markdown: kramdown
highlighter: rouge
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
